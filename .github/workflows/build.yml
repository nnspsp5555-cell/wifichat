name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          mkdir proj
          for f in *.zip; do unzip -o "$f" -d proj; done
          find proj -maxdepth 3 | head -50
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: |
          d=$(dirname "$(find proj -name settings.gradle.kts | head -1)")
          echo "Project dir: $d"
          cd "$d"
          gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: WifiChat-APK
          path: proj/**/build/outputs/apk/debug/*.apk
